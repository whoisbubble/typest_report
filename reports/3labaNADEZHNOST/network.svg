<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <defs>
    <style>
      .edge { stroke:#263238; stroke-width:4; }
      .inactive { stroke:#b0bec5; stroke-width:3; stroke-dasharray:10 8; }
      .path { stroke:#1565c0; stroke-width:8; }
      .alt { stroke:#ef6c00; stroke-width:7; }
      .node { fill:#fff; stroke:#263238; stroke-width:3; }
      .label { font: 25px 'Arial'; fill:#111; text-anchor:middle; dominant-baseline:middle; }
      .edge-label { font: bold 22px 'Arial'; fill:#111; paint-order:stroke; stroke:#fff; stroke-width:7; stroke-linejoin:round; }
      .path-label { fill:#0d47a1; }
      .alt-label { fill:#bf360c; }
    </style>
  </defs>

  <!-- Неактивные связи исходного графа -->
  <line class="inactive" x1="120" y1="90" x2="420" y2="150"/>
  <line class="inactive" x1="420" y1="150" x2="760" y2="90"/>
  <line class="inactive" x1="120" y1="90" x2="420" y2="285"/>
  <line class="inactive" x1="120" y1="330" x2="420" y2="150"/>
  <line class="inactive" x1="420" y1="285" x2="760" y2="90"/>
  <line class="inactive" x1="120" y1="90" x2="760" y2="90"/>
  <line class="inactive" x1="120" y1="330" x2="760" y2="330"/>

  <!-- Рёбра варианта 17 -->
  <line class="alt" x1="420" y1="150" x2="760" y2="90"/>
  <line class="path" x1="120" y1="330" x2="420" y2="285"/>
  <line class="path" x1="420" y1="285" x2="760" y2="330"/>
  <line class="edge" x1="120" y1="90" x2="120" y2="330"/>
  <line class="path" x1="760" y1="90" x2="760" y2="330"/>
  <line class="alt" x1="420" y1="150" x2="760" y2="330"/>

  <!-- Номера рёбер -->
  <text class="edge-label alt-label" x="585" y="102">2</text>
  <text class="edge-label path-label" x="270" y="285">3</text>
  <text class="edge-label path-label" x="590" y="285">4</text>
  <text class="edge-label" x="92" y="210">5</text>
  <text class="edge-label path-label" x="786" y="210">7</text>
  <text class="edge-label alt-label" x="595" y="218">10</text>

  <!-- Вершины -->
  <circle class="node" cx="120" cy="90" r="30"/><text class="label" x="120" y="90">1</text>
  <circle class="node" cx="420" cy="150" r="30"/><text class="label" x="420" y="150">2</text>
  <circle class="node" cx="760" cy="90" r="30"/><text class="label" x="760" y="90">3</text>
  <circle class="node" cx="120" cy="330" r="30"/><text class="label" x="120" y="330">4</text>
  <circle class="node" cx="420" cy="285" r="30"/><text class="label" x="420" y="285">5</text>
  <circle class="node" cx="760" cy="330" r="30"/><text class="label" x="760" y="330">6</text>

  <text x="450" y="397" font-family="Arial" font-size="20" text-anchor="middle" fill="#0d47a1">Синий путь: 3–6–5–4; оранжевый обход: 3–2–6</text>
  <text x="450" y="424" font-family="Arial" font-size="19" text-anchor="middle" fill="#455a64">Общие для обоих маршрутов рёбра: 3 и 4</text>
</svg>
