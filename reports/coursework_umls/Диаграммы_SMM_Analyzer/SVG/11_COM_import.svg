}</style><marker id="d-11_COM_import-filled" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker><marker id="d-11_COM_import-open" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#222" stroke-width="1.5"/></marker><marker id="d-11_COM_import-triangle" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L17 9 L1 17 Z" fill="white" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="3200" height="1600" fill="#fff"/><path d="M 228 453 L 642.0 453.0 Q 650 453 650.0 461.0 L 650.0 642.0 Q 650 650 658.0 650.0 L 870 650" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1330 700 L 1770 700" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 2230 700 L 2670 700" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 360 380 L 480 380" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-11_COM_import-filled)"/><path d="M 480 520 L 360 520" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-11_COM_import-open)"/><path d="M 1490 540 L 1610 540" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-11_COM_import-filled)"/><path d="M 1610 860 L 1490 860" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-11_COM_import-open)"/><path d="M 2390 540 L 2510 540" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-11_COM_import-filled)"/><path d="M 2510 860 L 2390 860" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-11_COM_import-open)"/><path d="M 1960 644 L 1960.0 188.0 Q 1960 180 1968.0 180.0 L 2032.0 180.0 Q 2040 180 2040.0 188.0 L 2040 644" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-11_COM_import-filled)"/><rect x="309.5" y="258" width="221" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="420" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1: импортировать(ключ)</text><rect x="340.5" y="558" width="159" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="420" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.3: итогПоказан</text><rect x="1416.5" y="358" width="267" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1550" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.1: обработатьИмпорт(ключ)</text><rect x="1461.5" y="898" width="177" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1550" y="920" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.2: исходИмпорта</text><rect x="2273.5" y="358" width="353" height="60" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="2450" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.1.2: сохранитьНаборИИтогАтомарно()</text><text x="2450" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[допустимо]</text><rect x="2340.5" y="898" width="219" height="60" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="2450" y="920" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.1.3: сохранённыйИтог</text><text x="2450" y="946" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[допустимо]</text><rect x="1780.0" y="58" width="440" height="60" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="2000" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.1.1: проверитьДоступИПовтор()</text><text x="2000" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">1.1.4: подготовитьОтказИлиИтогПовтора() [иначе]</text><g fill="none" stroke="#222" stroke-width="1.8"><circle cx="200" cy="420" r="14"/><path d="M200 434 V478 M172 453 H228 M200 478 L176 514 M200 478 L224 514"/></g><text x="200" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222" text-decoration="underline">: SMM-менеджер</text><rect x="870.0" y="644.0" width="460" height="112" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1100" y="672.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«boundary»</text><text x="1100" y="705.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Форма импорта</text><rect x="1770.0" y="644.0" width="460" height="112" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2000" y="672.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«control»</text><text x="2000" y="705.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Управление импортом</text><rect x="2670.0" y="644.0" width="460" height="112" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2900" y="672.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«entity»</text><text x="2900" y="705.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Данные публикации</text><text x="1600" y="1460" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222">Сообщения и условия совпадают с последовательностью. Альтернативы «допустимо» и «иначе» исключают друг друга.</text><text x="1600" y="1520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Номера задают порядок и вложенность; сплошные связи — ассоциации объектов, короткие стрелки — сообщения.</text></svg>
