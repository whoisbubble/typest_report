<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2640" role="img" aria-labelledby="21_DEP_system-title 21_DEP_system-desc" id="d-21_DEP_system-root"><title id="21_DEP_system-title">Развёртывание SMM Analyzer</title><desc id="21_DEP_system-desc">Рабочие места подключаются по HTTPS к серверу приложений с Docker; API и обработчик используют отдельный сервер PostgreSQL, с которого резервные копии передаются в отдельное хранилище по SFTP.</desc><defs>
      <style>#d-21_DEP_system-root { font-family: Arial,sans-serif; color: #222; }
      #d-21_DEP_system-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#d-21_DEP_system-root .diagram-container { overflow-x:visible }
}</style><marker id="d-21_DEP_system-filled" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker><marker id="d-21_DEP_system-open" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="2400" height="2640" fill="#fff"/><path d="M100 160 l20 -20 H680 V740 l-20 20 M660 160 l20 -20 M660 160 V760 M100 160 H660 V760 H100 Z" fill="white" stroke="#333" stroke-width="1.5"/><text x="380.0" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«device»</text><text x="380.0" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">Рабочие места [1..*]</text><text x="380.0" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">администратор / владелец</text><text x="380.0" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">SMM-менеджер · аналитик · заказчик</text><path d="M1000 160 l20 -20 H2220 V1520 l-20 20 M2200 160 l20 -20 M2200 160 V1540 M1000 160 H2200 V1540 H1000 Z" fill="white" stroke="#333" stroke-width="1.5"/><text x="1600.0" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«device»</text><text x="1600.0" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">Сервер приложений</text><text x="1600.0" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Linux · Docker Engine · закрытая сеть контейнеров</text><path d="M1000 1820 l20 -20 H2220 V2480 l-20 20 M2200 1820 l20 -20 M2200 1820 V2500 M1000 1820 H2200 V2500 H1000 Z" fill="white" stroke="#333" stroke-width="1.5"/><text x="1600.0" y="1854" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«device»</text><text x="1600.0" y="1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">Сервер базы данных</text><text x="1600.0" y="1932" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Linux · Docker Engine · постоянный том данных</text><path d="M100 2120 l20 -20 H680 V2480 l-20 20 M660 2120 l20 -20 M660 2120 V2500 M100 2120 H660 V2500 H100 Z" fill="white" stroke="#333" stroke-width="1.5"/><text x="380.0" y="2154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«device»</text><text x="380.0" y="2192" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#222">Хранилище копий</text><text x="380.0" y="2232" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">отдельный узел · SFTP / SSH:22</text><path d="M 660 420 L 1000 420" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1440 400 L 1440.0 328.0 Q 1440 320 1448.0 320.0 L 1872.0 320.0 Q 1880 320 1880.0 328.0 L 1880 400" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1320 620 L 1320 820" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1600 1540 L 1600 1820" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1600 2180 L 1600 2280" fill="none" stroke="#333" stroke-width="1.5"/><path d="M 1000 2380 L 660 2380" fill="none" stroke="#333" stroke-width="1.5"/><rect x="747.0" y="360" width="166" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="830" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">HTTPS · TCP 443</text><rect x="1604.0" y="328" width="112" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1660" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">HTTP:3000</text><rect x="1374.0" y="688" width="112" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1430" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">HTTP:3001</text><rect x="1670.0" y="1648" width="220" height="60" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1780" y="1670" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">PostgreSQL / TLS</text><text x="1780" y="1696" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">TCP 5432 · API и worker</text><rect x="1722.5" y="2222" width="155" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1800" y="2244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">libpq · TCP 5432</text><rect x="732.5" y="2316" width="195" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="830" y="2338" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">SFTP / SSH · TCP 22</text><text x="1200" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Проектная топология одного экземпляра системы · узлы, среды выполнения, компоненты и каналы</text><rect x="180" y="480" width="400" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="380.0" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«executionEnvironment»</text><text x="380.0" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Браузер</text><text x="204" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">клиентский JS и страницы</text><text x="204" y="624" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">загружаются с сервера</text><rect x="1080" y="400" width="480" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1320.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1320.0" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Nginx</text><path d="M1514 416 h26 v30 h-26 z M1506 422 h16 v7 h-16 z M1506 434 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1104" y="510" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">TLS → HTTPS:443</text><text x="1104" y="544" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">маршрутизация / и /api/*</text><rect x="1640" y="400" width="480" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1880.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1880.0" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Next.js / Node.js</text><path d="M2074 416 h26 v30 h-26 z M2066 422 h16 v7 h-16 z M2066 434 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1664" y="510" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">контейнер web</text><text x="1664" y="544" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">внутренний HTTP:3000</text><rect x="1080" y="820" width="480" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1320.0" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1320.0" y="886" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">NestJS / Node.js</text><path d="M1514 836 h26 v30 h-26 z M1506 842 h16 v7 h-16 z M1506 854 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1104" y="930" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">контейнер api</text><text x="1104" y="964" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">внутренний HTTP:3001</text><text x="1104" y="998" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">TypeORM → PostgreSQL</text><rect x="1640" y="1180" width="480" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1880.0" y="1210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1880.0" y="1246" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Node.js worker</text><path d="M2074 1196 h26 v30 h-26 z M2066 1202 h16 v7 h-16 z M2066 1214 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1664" y="1290" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">контейнер worker</text><text x="1664" y="1324" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">обработка по расписанию</text><text x="1664" y="1358" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">TypeORM → PostgreSQL</text><rect x="1120" y="1980" width="960" height="200" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1600.0" y="2010" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1600.0" y="2046" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">PostgreSQL</text><path d="M2034 1996 h26 v30 h-26 z M2026 2002 h16 v7 h-16 z M2026 2014 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1144" y="2090" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">контейнер db · том pgdata</text><text x="1144" y="2124" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">интерфейс PostgreSQL / TLS:5432</text><rect x="1120" y="2280" width="960" height="180" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1600.0" y="2310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«executable»</text><text x="1600.0" y="2346" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">pg_dump + планировщик</text><path d="M2034 2296 h26 v30 h-26 z M2026 2302 h16 v7 h-16 z M2026 2314 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1144" y="2390" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">согласованный дамп → шифрование → передача</text><text x="1144" y="2424" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">служебная среда на сервере БД</text><rect x="180" y="2280" width="400" height="180" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="380.0" y="2310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«artifact»</text><text x="380.0" y="2346" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Архив дампов</text><text x="204" y="2390" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">зашифрованные файлы</text><text x="204" y="2424" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">отдельный доступ и хранение</text><text x="1200" y="2560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Линия без стрелок — канал обмена. Куб — устройство; вложенный блок — установленный компонент или среда.</text><text x="1200" y="2604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Открыт только HTTPS:443. Порты 3000/3001/5432 доступны по внутренним правилам; SFTP ограничен сервером БД.</text></svg>
