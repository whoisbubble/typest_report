<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2440 2060" role="img" aria-labelledby="20_CMP_runtime-title 20_CMP_runtime-desc" id="d-20_CMP_runtime-root"><title id="20_CMP_runtime-title">Состав исполняемых компонентов системы</title><desc id="20_CMP_runtime-desc">Браузер обращается к единой HTTPS-точке входа, которая направляет запросы в Next.js и NestJS; API, обработчик и резервное копирование используют PostgreSQL.</desc><defs>
      <style>#d-20_CMP_runtime-root { font-family: Arial,sans-serif; color: #222; }
      #d-20_CMP_runtime-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#d-20_CMP_runtime-root .diagram-container { overflow-x:visible }
}</style><marker id="d-20_CMP_runtime-filled" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker><marker id="d-20_CMP_runtime-open" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="2440" height="2060" fill="#fff"/><path d="M 720 270 L 920 270" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 1520 270 L 1720 270" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 1220 380 L 1220 680" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 1220 940 L 1220 1220" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 1720 1340 L 1520 1340" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 720 1340 L 920 1340" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><path d="M 420 1480 L 420 1740" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#d-20_CMP_runtime-open)"/><rect x="780.5" y="216" width="79" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="820" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">HTTPS</text><rect x="1560.5" y="216" width="119" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1620" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Web / HTTP</text><rect x="1264.5" y="514" width="131" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1330" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">REST / JSON</text><rect x="1262.0" y="1068" width="56" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1290" y="1090" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">SQL</text><rect x="1592.0" y="1286" width="56" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1620" y="1308" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">SQL</text><rect x="792.0" y="1286" width="56" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="820" y="1308" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">SQL</text><rect x="477.0" y="1598" width="66" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="510" y="1620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">SFTP</text><text x="1220" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Исполняемый вариант · зависимости от предоставляемых интерфейсов</text><rect x="120" y="160" width="600" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="420.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="420.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Клиентский JS-пакет</text><path d="M674 176 h26 v30 h-26 z M666 182 h16 v7 h-16 z M666 194 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="144" y="270" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">среда: браузер пользователя</text><text x="144" y="304" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">требует: Web / REST через HTTPS</text><rect x="920" y="160" width="600" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1220.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1220.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Обратный прокси Nginx</text><path d="M1474 176 h26 v30 h-26 z M1466 182 h16 v7 h-16 z M1466 194 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="944" y="270" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">предоставляет: HTTPS, порт 443</text><text x="944" y="304" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">маршруты / → Web, /api/* → API</text><rect x="1720" y="160" width="600" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2020.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="2020.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Веб-приложение Next.js</text><path d="M2274 176 h26 v30 h-26 z M2266 182 h16 v7 h-16 z M2266 194 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1744" y="270" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">предоставляет: Web / HTTP</text><text x="1744" y="304" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">страницы, ресурсы, клиентский JS</text><rect x="920" y="680" width="600" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1220.0" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1220.0" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">API NestJS</text><path d="M1474 696 h26 v30 h-26 z M1466 702 h16 v7 h-16 z M1466 714 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="944" y="790" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">предоставляет: REST / JSON</text><text x="944" y="824" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">идентификация, доступ и сценарии</text><text x="944" y="858" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">требует: PostgreSQL / SQL</text><rect x="1720" y="1220" width="600" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2020.0" y="1250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="2020.0" y="1286" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Фоновый обработчик</text><path d="M2274 1236 h26 v30 h-26 z M2266 1242 h16 v7 h-16 z M2266 1254 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="1744" y="1330" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">Node.js · прикладной модуль анализа</text><text x="1744" y="1364" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">требует: PostgreSQL / SQL</text><text x="1744" y="1398" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">ML-адаптер — будущая ВКР</text><rect x="920" y="1220" width="600" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1220.0" y="1250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="1220.0" y="1286" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">СУБД PostgreSQL</text><path d="M1474 1236 h26 v30 h-26 z M1466 1242 h16 v7 h-16 z M1466 1254 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="944" y="1330" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">предоставляет: PostgreSQL / SQL</text><text x="944" y="1364" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">таблицы предметной области</text><text x="944" y="1398" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">транзакции, ограничения, аудит</text><rect x="120" y="1220" width="600" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="420.0" y="1250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="420.0" y="1286" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Резервное копирование</text><path d="M674 1236 h26 v30 h-26 z M666 1242 h16 v7 h-16 z M666 1254 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="144" y="1330" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">pg_dump + планировщик + SFTP</text><text x="144" y="1364" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">требует: SQL и доступ к архиву</text><text x="144" y="1398" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">отдельная служебная учётная запись</text><rect x="120" y="1740" width="600" height="220" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="420.0" y="1770" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«component»</text><text x="420.0" y="1806" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#222">Архив резервных копий</text><path d="M674 1756 h26 v30 h-26 z M666 1762 h16 v7 h-16 z M666 1774 h16 v7 h-16 z" fill="white" stroke="#333" stroke-width="1.3"/><text x="144" y="1850" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">предоставляет: SFTP / SSH</text><text x="144" y="1884" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">зашифрованные файлы дампов</text><text x="1420" y="1820" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Штриховая стрелка — зависимость от интерфейса, а не порядок выполнения и не направление всех данных.</text><text x="1420" y="1870" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">API и worker обмениваются состоянием через БД. Опубликованные версии отчётов хранятся в PostgreSQL.</text><text x="1220" y="2010" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Компоненты показаны без привязки к компьютерам; размещение и сетевые протоколы — на диаграмме 21.</text></svg>
