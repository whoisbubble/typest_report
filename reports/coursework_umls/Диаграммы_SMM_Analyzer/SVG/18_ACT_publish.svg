)"/><path d="M 900 2302 L 900 2365" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 1032 440 L 1350 440" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 1580 492 L 1580.0 692.0 Q 1580 700 1588.0 700.0 L 1972.0 700.0 Q 1980 700 1980.0 708.0 L 1980.0 2072.0 Q 1980 2080 1972.0 2080.0 L 1032 2080" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 768 850 L 188.0 850.0 Q 180 850 180.0 858.0 L 180 1008" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 180 1112 L 180.0 1902.0 Q 180 1910 188.0 1910.0 L 768 1910" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 768 1320 L 508.0 1320.0 Q 500 1320 500.0 1328.0 L 500 1488" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 1032 1320 L 1572.0 1320.0 Q 1580 1320 1580.0 1328.0 L 1580 1488" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 500 1592 L 500.0 1732.0 Q 500 1740 508.0 1740.0 L 768 1740" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><path d="M 1580 1592 L 1580.0 1732.0 Q 1580 1740 1572.0 1740.0 L 1032 1740" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#d-18_ACT_publish-filled)"/><rect x="1144.5" y="388" width="91" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1190" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[найден]</text><rect x="932.0" y="530" width="116" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="990" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[не найден]</text><rect x="431.0" y="798" width="58" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="460" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[нет]</text><rect x="934.5" y="944" width="51" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="960" y="966" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[да]</text><rect x="557.5" y="1266" width="125" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="620" y="1288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[неизвестен]</text><rect x="1234.5" y="1266" width="191" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1330" y="1288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[откат подтверждён]</text><rect x="940.5" y="1418" width="239" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1060" y="1440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">[фиксация подтверждена]</text><text x="1060" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Ключ запроса → проверка повтора → атомарная запись → подтверждённый или неизвестный итог</text><circle cx="900" cy="100" r="10" fill="#222"/><rect x="650.0" y="188" width="500" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="900" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Проверить пользователя, цель</text><text x="900" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">и соответствие ключа запросу</text><path d="M900 376 L1032 440 L900 504 L768 440 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Есть итог?</text><rect x="1350.0" y="388" width="460" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1580" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Подготовить ранее</text><text x="1580" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">сохранённый результат</text><rect x="650.0" y="598" width="500" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="900" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Проверить полномочия, выводы</text><text x="900" y="669" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">и ожидаемые версии</text><path d="M900 786 L1032 850 L900 914 L768 850 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="856" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Допустимо?</text><rect x="40.0" y="1008" width="280" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="180" y="1052" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Подготовить</text><text x="180" y="1079" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">подтверждённый отказ</text><rect x="620.0" y="1008" width="560" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="900" y="1052" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Атомарно сверить права и revision,</text><text x="900" y="1079" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">записать версию, ключ и аудит</text><path d="M900 1256 L1032 1320 L900 1384 L768 1320 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="1326" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Исход записи?</text><rect x="300.0" y="1488" width="400" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="500" y="1532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Подготовить unknown:</text><text x="500" y="1559" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">статус проверяется по ключу</text><rect x="720.0" y="1488" width="360" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="900" y="1532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Подготовить успешный</text><text x="900" y="1559" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">сохранённый результат</text><rect x="1330.0" y="1488" width="500" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1580" y="1532" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">После подтверждённого отката</text><text x="1580" y="1559" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">подготовить технический отказ</text><path d="M900 1676 L1032 1740 L900 1804 L768 1740 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="1746" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222"></text><path d="M900 1846 L1032 1910 L900 1974 L768 1910 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="1916" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222"></text><path d="M900 2016 L1032 2080 L900 2144 L768 2080 Z" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="2086" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222"></text><rect x="640.0" y="2198" width="520" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="900" y="2242" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Вернуть OperationOutcome</text><text x="900" y="2269" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">с прежним requestId</text><circle cx="900" cy="2380" r="15" fill="white" stroke="#222"/><circle cx="900" cy="2380" r="10" fill="#222"/><text x="1060" y="2440" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Каждое решение имеет слияние альтернатив. Неизвестный итог не считается откатом; повтор использует тот же ключ.</text></svg>
