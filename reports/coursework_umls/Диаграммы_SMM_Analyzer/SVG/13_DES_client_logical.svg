ine x1="820" y1="608" x2="1380" y2="608" stroke="#777"/><text x="838" y="562" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- выбранная кампания</text><text x="838" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- сеанс</text><text x="838" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ выбратьКампанию(идентификатор)</text><text x="838" y="666" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ открытьРаздел(раздел)</text><rect x="80" y="480" width="600" height="204" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="380.0" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Модель кабинета заказчика</text><line x1="80" y1="532" x2="680" y2="532" stroke="#777"/><line x1="80" y1="608" x2="680" y2="608" stroke="#777"/><text x="98" y="562" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- интерфейс приложения</text><text x="98" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- опубликованные отчёты</text><text x="98" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ загрузить(клиент)</text><text x="98" y="666" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ открыть(версия): отчёт</text><rect x="80" y="960" width="600" height="204" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="380.0" y="993" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Модель формы кампании</text><line x1="80" y1="1012" x2="680" y2="1012" stroke="#777"/><line x1="80" y1="1088" x2="680" y2="1088" stroke="#777"/><text x="98" y="1042" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- данные кампании</text><text x="98" y="1070" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- интерфейс приложения</text><text x="98" y="1118" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ загрузить(идентификатор)</text><text x="98" y="1146" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сохранить(данные)</text><rect x="800" y="960" width="600" height="260" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1100.0" y="993" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Модель формы импорта</text><line x1="800" y1="1012" x2="1400" y2="1012" stroke="#777"/><line x1="800" y1="1116" x2="1400" y2="1116" stroke="#777"/><text x="818" y="1042" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- публикация</text><text x="818" y="1070" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- незавершённый запрос импорта</text><text x="818" y="1098" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- интерфейс приложения</text><text x="818" y="1146" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ отправить(файл): исход импорта</text><text x="818" y="1174" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ уточнитьИтог(): исход импорта</text><text x="818" y="1202" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ очистить()</text><rect x="1520" y="960" width="600" height="344" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1820.0" y="993" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Модель формы отчёта</text><line x1="1520" y1="1012" x2="2120" y2="1012" stroke="#777"/><line x1="1520" y1="1116" x2="2120" y2="1116" stroke="#777"/><text x="1538" y="1042" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- черновик</text><text x="1538" y="1070" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- незавершённая публикация</text><text x="1538" y="1098" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- интерфейс приложения</text><text x="1538" y="1146" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сформировать(кампания, период)</text><text x="1538" y="1174" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сохранитьВыводы(текст): черновик</text><text x="1538" y="1202" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ опубликовать(): исход публикации</text><text x="1538" y="1230" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ уточнитьИтог(): исход публикации</text><text x="1538" y="1258" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ открыть(отчёт): черновик</text><text x="1538" y="1286" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ обновитьРасчёты(): черновик</text><rect x="460" y="1580" width="1020" height="476" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="970.0" y="1606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«interface»</text><text x="970.0" y="1634" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Интерфейс приложения</text><line x1="460" y1="1656" x2="1480" y2="1656" stroke="#777"/><line x1="460" y1="1700" x2="1480" y2="1700" stroke="#777"/><text x="478" y="1730" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ получитьКампании(): список кампаний</text><text x="478" y="1758" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сохранитьКампанию(данные): идентификатор</text><text x="478" y="1786" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ импортировать(публикация, файл, ключ): исход</text><text x="478" y="1814" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ получитьИтогИмпорта(ключ): исход</text><text x="478" y="1842" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сформироватьЧерновик(кампания, период): черновик</text><text x="478" y="1870" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ сохранитьЧерновик(отчёт, revision, выводы): черновик</text><text x="478" y="1898" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ опубликовать(отчёт, revision, ключ): исход</text><text x="478" y="1926" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ получитьИтогПубликации(ключ): исход</text><text x="478" y="1954" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ получитьОпубликованные(клиент): список версий</text><text x="478" y="1982" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ прочитатьОпубликованнуюВерсию(версия): отчёт</text><text x="478" y="2010" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ прочитатьЧерновик(отчёт): черновик</text><text x="478" y="2038" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ обновитьРасчёты(отчёт, revision): черновик</text><rect x="1520" y="1580" width="600" height="288" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1820.0" y="1613" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">Черновик отчёта</text><line x1="1520" y1="1632" x2="2120" y2="1632" stroke="#777"/><line x1="1520" y1="1736" x2="2120" y2="1736" stroke="#777"/><text x="1538" y="1662" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- идентификатор отчёта</text><text x="1538" y="1690" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- версия редактирования</text><text x="1538" y="1718" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- выводы</text><text x="1538" y="1766" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ идентификатор(): строка</text><text x="1538" y="1794" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ версия(): целое</text><text x="1538" y="1822" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ выводы(): текст</text><text x="1538" y="1850" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">+ заполнен(): логическое</text><rect x="80" y="2360" width="600" height="148" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="380.0" y="2393" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">HTTP-адаптер приложения</text><line x1="80" y1="2412" x2="680" y2="2412" stroke="#777"/><line x1="80" y1="2460" x2="680" y2="2460" stroke="#777"/><text x="98" y="2442" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#222">- адрес API</text><text x="98" y="2490" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#222">- выполнитьЗапрос(маршрут): результат</text><text x="1120" y="2660" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222">Сплошная стрелка — навигация по хранимой ссылке · штриховая с пустым треугольником — реализация интерфейса.</text><text x="1120" y="2710" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Классы основных сценариев; учётные записи и другие разделы имеют отдельные интерфейсы за пределами этого представления.</text><text x="1120" y="2760" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">Методы HttpApplicationApi реализуют весь контракт; в классе показаны внутреннее состояние и общий механизм запроса.</text></svg>
