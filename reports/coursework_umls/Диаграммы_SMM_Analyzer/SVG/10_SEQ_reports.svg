" fill="#fff" stroke="none" stroke-width="1.5" /><text x="910.0" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2: сохранитьВыводы(текст, revision)</text><rect x="1389.5" y="1106" width="221" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1500.0" y="1128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2.1: сохранитьВыводы()</text><rect x="2025.0" y="1222" width="310" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="2180.0" y="1244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2.1.1: обновитьЧерновикУсловно()</text><rect x="2085.5" y="1338" width="189" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="2180.0" y="1360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2.1.2: новаяRevision</text><rect x="1377.0" y="1454" width="246" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1500.0" y="1476" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2.2: сохранённыйЧерновик</text><rect x="771.0" y="1570" width="278" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="910.0" y="1592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2.3: сохранениеПодтверждено</text><rect x="519.5" y="1686" width="281" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="660.0" y="1708" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">3: опубликовать(ключ, revision)</text><rect x="1376.5" y="1802" width="247" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><text x="1500.0" y="1824" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">3.1: опубликоватьВерсию()</text><rect x="1909.0" y="1918" width="362" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1.5" /><tex