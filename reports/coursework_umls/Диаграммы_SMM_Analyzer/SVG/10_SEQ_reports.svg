 133 H688 M660 158 L636 194 M660 158 L684 194"/></g><text x="660" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#222" text-decoration="underline">: Аналитик</text><rect x="960.0" y="98.0" width="400" height="104" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1160" y="126.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«boundary»</text><text x="1160" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Форма отчёта</text><rect x="1640.0" y="98.0" width="400" height="104" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1840" y="126.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«control»</text><text x="1840" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Управление отчётами</text><rect x="2320.0" y="98.0" width="400" height="104" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2520" y="126.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">«entity»</text><text x="2520" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#222" text-decoration="underline">: Отчёт</text><text x="1400" y="2938" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">Подготовка и сохранение выводов показаны при успешных предусловиях; alt уточняет итог команды публикации.</text></svg>
