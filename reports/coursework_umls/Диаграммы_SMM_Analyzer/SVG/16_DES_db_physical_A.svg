ll="#222">PK id: uuid</text><text x="2140" y="333" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">name: varchar(200)</text><rect x="120" y="1000" width="760" height="292" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="500" y="1036" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">audit_events</text><line x1="120" y1="1064" x2="880" y2="1064" stroke="#777"/><text x="140" y="1091" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">PK id: uuid</text><text x="140" y="1133" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">FK actor_id: uuid</text><text x="140" y="1175" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">action: varchar(80)</text><text x="140" y="1217" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">object_id: uuid</text><text x="140" y="1259" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">occurred_at: timestamptz</text><rect x="1120" y="1000" width="760" height="166" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="1500" y="1036" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">campaign_assignments</text><line x1="1120" y1="1064" x2="1880" y2="1064" stroke="#777"/><text x="1140" y="1091" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">PK,FK campaign_id: uuid</text><text x="1140" y="1133" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#222">PK,FK user_id: uuid</text><rect x="2120" y="1000" width="760" height="418" rx="0" fill="#fff" stroke="#333" stroke-width="1.5" /><text x="2500" y="1036" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#222">campaigns</text><line x1="2120" y1="1064" x2="2880" y2="1064" stroke="#777"/><text x="2140" y="1091" text-anchor="start" font-family="Arial, sans-serif" font-size="20"